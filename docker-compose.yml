services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: salata-frontend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - shared_dist:/usr/share/nginx/html

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: salata-backend
    restart: always
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
      - frontend
    env_file:
      - ./server/.env
    environment:
      - LOCAL_FRONTEND_ON_BACKEND=true 
    volumes:
      - shared_dist:/frontend/dist

  mongodb:
    image: mongo:7.0
    container_name: salata-mongodb
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - ./server/.env
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  shared_dist:
